name: SK monitor daily

on:
  schedule:
    - cron: "0 */3 * * *"   # každé 3 hodiny (menej kolízií Pages deployov)
  workflow_dispatch: {}       # ručné spustenie tlačidlom "Run workflow"

permissions:
  contents: write             # commit data/ + docs/

# serializuje behy: kým jeden beží, nový ho nahradí -> žiadne prekrývanie a commitovanie cez seba
concurrency:
  group: sk-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # BEZPEČNOSTNÁ BRÁNA: zastaví nasadenie, ak sa interné dáta/tajomstvá dostali do repa.
      - name: Bezpečnostná brána (pred publikovaním)
        run: python tools/security_gate.py
      - name: Commit výstupov
        run: |
          git config user.name "sk-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "SK monitor ${{ github.run_id }}" || { echo "Nič nové na commit."; exit 0; }
          # odolné pushovanie: ak remote medzitým napredoval (súbeh behov / ručný push), rebasuj a skús znova
          for i in 1 2 3 4 5; do
            if git push; then echo "push OK (pokus $i)"; exit 0; fi
            echo "push odmietnutý, rebasujem na origin/main (pokus $i)…"
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "push zlyhal po 5 pokusoch"; exit 1
